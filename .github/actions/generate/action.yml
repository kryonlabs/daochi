name: Generate the server's Go
description: Sets up the Ziran pinned in ziran.lock and generates the Go from the Zi sources. Run it after setup-go.
runs:
  using: composite
  steps:
    # Go ignores the dot folder, and the deploy and image leave it out.
    - name: Set up the pinned Ziran
      id: ziran
      uses: ziranlang/ziran/.github/actions/setup@5d3e5ca4cae76398dd2545a0e33d2b741fe5d321
      with:
        path: .ziran
    # Packages the build fetches stay outside the checkout, where go ./...
    # would compile their files.
    - name: Generate the Go
      shell: bash
      env:
        XDG_CACHE_HOME: ${{ runner.temp }}/ziran-cache
        ZIRAN: ${{ steps.ziran.outputs.ziran }}
      run: make generate ZIRAN="$ZIRAN"
