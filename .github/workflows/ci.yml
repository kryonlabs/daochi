name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daochi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Cache vendored liboqs build
        uses: actions/cache@v4
        with:
          path: build/liboqs
          key: liboqs-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('vendor/liboqs/CMakeLists.txt') }}

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check generated diff hygiene
        run: git diff --check

      - name: Test
        run: make test

      - name: Race test
        run: make test GOFLAGS="-mod=mod -race"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build container image
        run: docker build --pull -t daochi:ci .
