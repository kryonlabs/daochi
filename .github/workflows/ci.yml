name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daochi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Cache vendored liboqs build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/liboqs
          key: liboqs-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('vendor/liboqs/CMakeLists.txt') }}

      - name: Build liboqs
        run: make liboqs

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Lint
        run: golangci-lint run --timeout=5m
        env:
          CGO_ENABLED: "1"
          GOFLAGS: "-mod=mod"
          CGO_CFLAGS: "-I${{ github.workspace }}/build/liboqs/install/include"
          CGO_LDFLAGS: "-L${{ github.workspace }}/build/liboqs/install/lib -loqs"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24.x", "1.26.x"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Cache vendored liboqs build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/liboqs
          key: liboqs-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('vendor/liboqs/CMakeLists.txt') }}

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check generated diff hygiene
        run: git diff --check

      - name: Test
        run: make test

      - name: Race test
        run: make test GOFLAGS="-mod=mod -race"

      - name: Report coverage
        if: matrix.go-version == '1.26.x'
        run: |
          CGO_ENABLED=1 GOFLAGS="-mod=mod" \
            CGO_CFLAGS="-I$(pwd)/build/liboqs/install/include" \
            CGO_LDFLAGS="-L$(pwd)/build/liboqs/install/lib -loqs" \
            GOCACHE=/tmp/daochi-gocache \
            go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Build container image
        run: docker build --pull --build-arg VERSION=ci-${{ github.sha }} -t daochi:ci .
