name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: daochi-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - name: Generate the Go from the Zi sources
        uses: ./.github/actions/generate
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Cache vendored liboqs build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/liboqs
          key: liboqs-${{ runner.os }}-${{ github.event.repository.name }}-${{ hashFiles('vendor/liboqs/CMakeLists.txt') }}
      - name: Build and test
        run: |
          python3 -B scripts/test_migrate_env.py
          make test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"

      - name: Generate the Go from the Zi sources
        uses: ./.github/actions/generate

      - name: Configure SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${{ secrets.DAOCHI_SSH_KEY }}" > ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DAOCHI_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync source and build on origin
        run: |
          REMOTE="${{ secrets.DAOCHI_USER }}@${{ secrets.DAOCHI_HOST }}"
          tar --exclude='.git' --exclude='.ziran' --exclude='build' --exclude='*.db' \
              --exclude='vendor/liboqs' -czf - . | \
            ssh "$REMOTE" '
              set -e
              rm -rf /opt/daochi-src.new
              mkdir -p /opt/daochi-src.new
              tar -C /opt/daochi-src.new -xzf -
              # keep the prebuilt build dir and the vendored liboqs
              # source from the previous tree (the origin cannot clone
              # submodules itself)
              for keep in build vendor/liboqs; do
                if [ -d "/opt/daochi-src/$keep" ]; then
                  mkdir -p "/opt/daochi-src.new/$(dirname "$keep")"
                  cp -a "/opt/daochi-src/$keep" "/opt/daochi-src.new/$keep"
                fi
              done
              rm -rf /opt/daochi-src.old
              [ -d /opt/daochi-src ] && mv /opt/daochi-src /opt/daochi-src.old
              mv /opt/daochi-src.new /opt/daochi-src
              rm -rf /opt/daochi-src.old
              cd /opt/daochi-src
              make build VERSION=${{ github.sha }}
            '

      # Google Play purchases need a service account that Play Console lets view
      # financial data and manage orders. Without the optional secret the node
      # keeps the verifier it has.
      - name: Install the Google Play service account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.DAOCHI_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "No DAOCHI_GOOGLE_SERVICE_ACCOUNT_JSON secret; the node keeps its Google Play verifier settings"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" | python3 -I -c '
          import json, sys
          account = json.load(sys.stdin)
          if account.get("type") != "service_account" or not account.get("client_email") or not account.get("private_key"):
              sys.exit("DAOCHI_GOOGLE_SERVICE_ACCOUNT_JSON is not a Google service account key")
          print("Google Play service account:", account["client_email"])
          '
          REMOTE="${{ secrets.DAOCHI_USER }}@${{ secrets.DAOCHI_HOST }}"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" | ssh "$REMOTE" '
            set -e
            account=/etc/daochi/google-play-service-account.json
            umask 077
            cat > "$account.new"
            user=$(systemctl show daochi.service -p User --value)
            if [ -n "$user" ]; then
              chown "$user" "$account.new"
            fi
            mv "$account.new" "$account"
          '

      - name: Swap binary and restart
        id: swap
        env:
          DAOCHI_NODE_SYNC_TOKEN: ${{ secrets.DAOCHI_NODE_SYNC_TOKEN }}
        run: |
          REMOTE="${{ secrets.DAOCHI_USER }}@${{ secrets.DAOCHI_HOST }}"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          mesh_token=$(printf '%s' "$DAOCHI_NODE_SYNC_TOKEN" | sed "s/'/'\\\\''/g")
          ssh "$REMOTE" "
            set -e
            mkdir -p /var/lib/daochi/backups
            cp /opt/daochi/daochi \"/var/lib/daochi/backups/daochi.pre-upgrade.$STAMP\"
            sqlite3 /var/lib/daochi/daochi.db \".backup '/var/lib/daochi/backups/daochi.db.$STAMP'\"
            test -s \"/var/lib/daochi/backups/daochi.db.$STAMP\"
            # A daily timer deletes backups older than 30 days, also between deploys.
            install -m 644 /opt/daochi-src/deploy/daochi-backup-prune.service /opt/daochi-src/deploy/daochi-backup-prune.timer /etc/systemd/system/
            systemctl daemon-reload
            systemctl enable --now daochi-backup-prune.timer
            systemctl start daochi-backup-prune.service
            cp /opt/daochi-src/daochi /opt/daochi/daochi.new
            mv /opt/daochi/daochi.new /opt/daochi/daochi
            if [ -n '$mesh_token' ]; then
              install -d -m 755 /etc/systemd/system/daochi.service.d
              umask 077
              printf '%s\n' '[Service]' 'Environment=DAOCHI_NODE_SYNC_TOKEN=$mesh_token' > /etc/systemd/system/daochi.service.d/20-daochi-mesh.conf
              systemctl daemon-reload
            fi
            install -m 600 /etc/daochi/daochi.env \"/var/lib/daochi/backups/daochi.env.$STAMP\"
            python3 /opt/daochi-src/scripts/migrate-legacy-env.py /etc/daochi/daochi.env --apply --canonical-only
            sh /opt/daochi-src/deploy/set-environment.sh /opt/daochi-src/deploy/node.env /etc/daochi/daochi.env
            if [ -s /etc/daochi/google-play-service-account.json ]; then
              echo DAOCHI_GOOGLE_SERVICE_ACCOUNT_JSON_FILE=/etc/daochi/google-play-service-account.json |
                sh /opt/daochi-src/deploy/set-environment.sh - /etc/daochi/daochi.env
            fi
            systemctl stop daochi.service
            # A raised Dew ratio or a new Dew product in deploy/dew-ratio.env
            # rewrites the environment; if that fails, the previous node comes back.
            if ! sh /opt/daochi-src/deploy/apply-dew-ratio.sh /opt/daochi-src/deploy/dew-ratio.env /etc/daochi/daochi.env /opt/daochi/daochi /var/lib/daochi/daochi.db; then
              cp \"/var/lib/daochi/backups/daochi.pre-upgrade.$STAMP\" /opt/daochi/daochi
              cp \"/var/lib/daochi/backups/daochi.db.$STAMP\" /var/lib/daochi/daochi.db
              cp \"/var/lib/daochi/backups/daochi.env.$STAMP\" /etc/daochi/daochi.env
              systemctl start daochi.service
              exit 1
            fi
            systemctl start daochi.service
            sleep 3
            systemctl is-active --quiet daochi.service
          "

      - name: Health check (rollback on failure)
        run: |
          REMOTE="${{ secrets.DAOCHI_USER }}@${{ secrets.DAOCHI_HOST }}"
          STAMP=${{ steps.swap.outputs.stamp }}
          code=000
          for attempt in $(seq 1 30); do
            code=$(ssh "$REMOTE" 'curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080/readyz"' || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "health check: $code"
          if [ "$code" != "200" ]; then
            echo "::error::health check failed ($code) - rolling back"
            ssh "$REMOTE" "systemctl stop daochi.service && cp /var/lib/daochi/backups/daochi.pre-upgrade.$STAMP /opt/daochi/daochi && cp /var/lib/daochi/backups/daochi.db.$STAMP /var/lib/daochi/daochi.db && cp /var/lib/daochi/backups/daochi.env.$STAMP /etc/daochi/daochi.env && systemctl start daochi.service"
            exit 1
          fi
          pub=000
          for attempt in $(seq 1 15); do
            pub=$(curl -sS -o /dev/null -w "%{http_code}" "https://api.waozi.xyz/readyz" || true)
            [ "$pub" = "200" ] && break
            sleep 2
          done
          echo "public endpoint through Cloudflare: $pub"
          if [ "$pub" != "200" ]; then
            echo "::error::public health check failed ($pub) - rolling back"
            ssh "$REMOTE" "systemctl stop daochi.service && cp /var/lib/daochi/backups/daochi.pre-upgrade.$STAMP /opt/daochi/daochi && cp /var/lib/daochi/backups/daochi.db.$STAMP /var/lib/daochi/daochi.db && cp /var/lib/daochi/backups/daochi.env.$STAMP /etc/daochi/daochi.env && systemctl start daochi.service"
            exit 1
          fi
