name: Cloudflare Pages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daochi-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check Site
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/protocol.html
          test -f site/mesh.html
          test -f site/apps.html
          test -f site/tokens.html
          test -f site/styles.css
          test -f site/_headers

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=daochi --branch=${{ github.head_ref || github.ref_name }}
