name: security

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: daochi-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cgo: ['0', '1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true

      - name: Generate the Go from the Zi sources
        uses: ./.github/actions/generate

      - name: Build native cryptography for the production scan
        if: matrix.cgo == '1'
        uses: ./.github/actions/liboqs

      - name: Install the pinned vulnerability scanner
        env:
          CGO_ENABLED: '0'
          GOFLAGS: '-mod=mod'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan the generated application packages
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOFLAGS: "-mod=mod"
          CGO_CFLAGS: "-I${{ github.workspace }}/build/liboqs/install/include"
          CGO_LDFLAGS: "-L${{ github.workspace }}/build/liboqs/install/lib -loqs"
        run: |
          test -s server.zi.go
          test -s google_play_reconciliation.zi.go
          govulncheck ./...

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          vulnerability-check: true
          license-check: true

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true

      - name: Generate the Go from the Zi sources
        uses: ./.github/actions/generate

      - name: Build the vendored liboqs
        uses: ./.github/actions/liboqs

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: go
          queries: security-extended,security-and-quality

      - name: Build
        run: make build

      - name: Analyze
        uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          output: codeql-results

      - name: Reject high severity CodeQL findings
        run: python3 -B scripts/check_sarif.py codeql-results
  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"

      - name: Generate the Go from the Zi sources
        uses: ./.github/actions/generate

      - name: Build image
        run: docker build --pull -t daochi:security .

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: daochi:security
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false
          limit-severities-for-sarif: true

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: trivy-results.sarif
