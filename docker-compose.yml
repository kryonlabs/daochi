services:
  ksync:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KSYNC_ADDR: 0.0.0.0:8080
      KSYNC_BASE_URL: https://api.example.com
      KSYNC_DB: /data/ksync.db
      KSYNC_TOKEN_SECRET_HEX: ${KSYNC_TOKEN_SECRET_HEX:?set KSYNC_TOKEN_SECRET_HEX to a stable 32-byte hex secret}
    volumes:
      - ksync-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ksync-data:
