services:
  daochi:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DAOCHI_ADDR: 0.0.0.0:8080
      DAOCHI_BASE_URL: https://api.example.com
      DAOCHI_DB: /data/daochi.db
      DAOCHI_TOKEN_SECRET_HEX: ${DAOCHI_TOKEN_SECRET_HEX:?set DAOCHI_TOKEN_SECRET_HEX to a stable 32-byte hex secret}
    volumes:
      - daochi-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  daochi-data:
